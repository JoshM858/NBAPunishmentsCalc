<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punishment Watch</title>
  <meta name="description" content="Fantasy basketball front office: weekly punishment odds, players, trades and league tools.">
  <meta name="theme-color" content="#101216">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23e8f02a'/><path d='M3 32h58M32 3v58M12 10c10 10 10 34 0 44M52 10c-10 10-10 34 0 44' stroke='%23101216' stroke-width='3' fill='none'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <span class="mark" aria-hidden="true">PW</span>
        <div>
          <h1 id="league-name">Punishment Watch</h1>
          <span id="week-label" class="sub"></span>
        </div>
      </div>
      <div class="top-tools">
        <span id="updated" class="updated" aria-live="polite"></span>
        <button id="account" type="button" class="acct" hidden></button>
        <button id="refresh" type="button" class="btn">Refresh</button>
      </div>
    </div>
    <nav id="mainnav" class="mainnav" aria-label="Main"></nav>
  </header>
  <nav id="subnav" class="subnav" aria-label="Section" hidden><div class="subnav-in" id="subnav-in"></div></nav>

  <p id="banner" class="banner" hidden></p>
  <main id="view" class="frame" aria-live="polite"><p class="loading">Loading league…</p></main>
  <footer id="foot" class="foot"></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
